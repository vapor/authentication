name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [main] }
permissions:
  contents: read

jobs:
  unit-tests:
    uses: vapor/ci/.github/workflows/run-unit-tests.yml@main
    with:
      with_api_check: ${{ github.event_name == 'pull_request' }}
      warnings_as_errors: true
      with_linting: true
      with_windows: true
      with_musl: true
      with_android: true
      with_wasm: true
      ios_scheme_name: authentication
    secrets: inherit

  submit-dependencies:
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit

  foundation-linking:
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    permissions:
      contents: read
    with:
      swift_image: swift:6.3-noble